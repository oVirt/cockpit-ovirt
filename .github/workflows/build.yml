---
name: Build

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shortcut: [el9, el10, el9s, el10s]
        yarn-install: [true, false]
        include:
          - name: almalinux-9
            shortcut: el9
            container-name: almalinux9
          - name: almalinux-10
            shortcut: el10
            container-name: almalinux10
          - name: centos-stream-9
            shortcut: el9s
            container-name: el9stream
          - name: centos-stream-10
            shortcut: el10s
            container-name: el10stream

    name: Build on ${{ matrix.name }}${{ matrix.yarn-install && ' (online yarn)' || '' }}
    container:
      image: quay.io/ovirt/buildcontainer:${{ matrix.container-name }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Mark repository as safe
        run: git config --global --add safe.directory "$(pwd)"

      - name: Install dependencies
        run: dnf install -y autoconf automake gettext-devel git make rpm-build gettext ovirt-engine-nodejs-modules

      - name: Set up nodejs path
        run: echo "/usr/share/ovirt-engine-nodejs-modules/bin" >> $GITHUB_PATH

      - name: Set build environment
        run: |
          TAG=$(git tag --points-at HEAD | head -1)
          if [[ -n "$TAG" ]]; then
            if [[ "$TAG" =~ -([0-9]+)$ ]]; then
              echo "PACKAGE_RPM_RELEASE=${BASH_REMATCH[1]}" >> $GITHUB_ENV
            else
              echo "PACKAGE_RPM_RELEASE=1" >> $GITHUB_ENV
            fi
          else
            echo "RELEASE_SUFFIX=.$(date --utc +%Y%m%d%H%M%S).git$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          fi

      - name: Autogen
        run: ./autogen.sh ${{ matrix.yarn-install && '--with-yarn-install' || '' }}

      - name: Configure
        run: ./configure ${{ matrix.yarn-install && '--with-yarn-install' || '' }}

      - name: Run checks
        run: |
          if [[ "${{ matrix.yarn-install }}" == "true" ]]; then
            yarn config delete yarn-offline-proxy
          else
            source /usr/share/ovirt-engine-nodejs-modules/setup-env.sh
            pushd dashboard && yarn install && popd
          fi
          make -j check

      - name: Build RPM
        run: make -j rpm

      - name: Collect artifacts
        run: |
          mkdir -p exported-artifacts
          find tmp.repos -iname \*rpm -exec mv "{}" exported-artifacts/ \;
          mv ./*tar.gz exported-artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.shortcut }}${{ matrix.yarn-install && '-yarn' || '' }}
          path: exported-artifacts

  publish-rpms:
    permissions:
      artifact-metadata: read
    needs: build
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    uses: ovirt/ovirt-workflows/.github/workflows/publish-rpms.yml@main
    secrets: inherit
